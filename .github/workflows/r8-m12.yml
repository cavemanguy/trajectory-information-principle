name: R8-M12 Pre-History Susceptibility Predictor

on:
  push:
    paths:
      - 'experiments/r8_m12/**'
      - '.github/workflows/r8-m12.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONHASHSEED: '0'

jobs:
  smoke:
    name: R8-M12 outcome-free smoke gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: pip install -r experiments/r8_m12/requirements.txt
      - name: Compile implementation
        run: |
          python -m py_compile experiments/r8_m10/m7r_base.py
          python -m py_compile experiments/r8_m12/run_r8_m12.py
          python -m py_compile experiments/r8_m12/classify_r8_m12.py
      - name: Verify parent engine exists
        run: |
          python - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('experiments/r8_m10/m7r_base.py')
          assert p.exists()
          print('R8-M10 engine sha256=' + hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Outcome-free classifier self-check
        run: python experiments/r8_m12/classify_r8_m12.py --self-check
      - name: Run outcome-free smoke path
        run: python experiments/r8_m12/run_r8_m12.py --seed 1341 --outdir /tmp/r8_m12_smoke --smoke
      - name: Verify smoke structure
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/r8_m12_smoke/smoke_summary.json'))
          assert d['all_valid'] is True
          assert d['diagnostic_state_immutable'] is True
          for axis in ('AB','CD'):
              for block in ('F1','F2','E','R'):
                  x=d['susceptibility'][axis][block]
                  assert x['relative_contrast'] >= 0
          for k in ('H_true_AB','H_null_AB','H_null_CD','H_true_CD','SPECIFICITY'):
              assert isinstance(d['effects'][k], (int,float))
          print('R8-M12 smoke structure ok')
          PY

  family:
    name: R8-M12 fresh family ${{ matrix.seed }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        seed: [1341, 1359, 1376, 1394, 1412, 1429, 1447, 1465, 1483, 1500, 1518, 1536]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: pip install -r experiments/r8_m12/requirements.txt
      - name: Execute fresh heterogeneity-predictor family
        run: |
          mkdir -p results/r8_m12/seed_${{ matrix.seed }}
          python experiments/r8_m12/run_r8_m12.py \
            --seed ${{ matrix.seed }} \
            --outdir results/r8_m12/seed_${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: r8-m12-seed-${{ matrix.seed }}
          path: results/r8_m12/seed_${{ matrix.seed }}/seed_summary.json
          if-no-files-found: error

  classify:
    name: R8-M12 frozen cross-family classification
    needs: family
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: pip install -r experiments/r8_m12/requirements.txt
      - name: Download family artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: r8-m12-seed-*
          path: results/r8_m12/families
          merge-multiple: false
      - name: Apply frozen classifier
        run: |
          mkdir -p results/r8_m12/aggregate
          python experiments/r8_m12/classify_r8_m12.py \
            --root results/r8_m12/families \
            --outdir results/r8_m12/aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: r8-m12-aggregate
          path: results/r8_m12/aggregate/
          if-no-files-found: error
      - name: Commit authoritative R8-M12 result record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B r8-m12-results
          git add results/r8_m12/aggregate/FINAL_RESULT.json results/r8_m12/aggregate/FINAL_RESULT.md
          git commit -m 'Record frozen R8-M12 result' || true
          git push --force origin HEAD:r8-m12-results
