name: JTP-1 Joint Trajectory-Perturbation Mapping

on:
  push:
    branches:
      - jtp-1
    paths:
      - 'experiments/jtp_1/**'
      - '.github/workflows/jtp-1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  analyze:
    name: Frozen JTP-1 seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 7
            source_run: 33560910331
            source_artifact: observer-r2-seed7-core
          - seed: 19
            source_run: 33562734327
            source_artifact: observer-r2-seed19-core
          - seed: 43
            source_run: 33566188625
            source_artifact: observer-r2-seed43-core
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jtp-1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/jtp_1/requirements.txt

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r experiments/jtp_1/requirements.txt

      - name: Download exact frozen Observer-R2 core
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.source_artifact }}
          path: frozen_core
          repository: cavemanguy/trajectory-information-principle
          run-id: ${{ matrix.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify preregistration and source files exist
        run: |
          test -f experiments/jtp_1/PREREGISTRATION.md
          test -f frozen_core/core_best.pt
          test -f frozen_core/core_summary.json
          python -m py_compile experiments/jtp_1/run_jtp1.py

      - name: Execute frozen JTP-1 grid
        run: |
          mkdir -p results/jtp_1/seed_${{ matrix.seed }}
          python experiments/jtp_1/run_jtp1.py \
            --seed ${{ matrix.seed }} \
            --core-path frozen_core/core_best.pt \
            --summary-path frozen_core/core_summary.json \
            --outdir results/jtp_1/seed_${{ matrix.seed }} \
            2>&1 | tee results/jtp_1/seed_${{ matrix.seed }}/run.log

      - uses: actions/upload-artifact@v4
        with:
          name: jtp1-seed-${{ matrix.seed }}
          path: results/jtp_1/seed_${{ matrix.seed }}/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    name: Frozen cross-seed classification
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jtp-1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/jtp_1/requirements.txt

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r experiments/jtp_1/requirements.txt

      - name: Download all seed outputs
        uses: actions/download-artifact@v4
        with:
          pattern: jtp1-seed-*
          path: collected

      - name: Apply preregistered outcome rule
        run: |
          mkdir -p results/jtp_1/seeds results/jtp_1/aggregate
          cp -R collected/jtp1-seed-* results/jtp_1/seeds/
          python experiments/jtp_1/run_jtp1.py \
            --aggregate collected \
            --outdir results/jtp_1/aggregate
          cat results/jtp_1/aggregate/FINAL_RESULT.md

      - uses: actions/upload-artifact@v4
        with:
          name: jtp1-aggregate
          path: results/jtp_1/
          retention-days: 90
          if-no-files-found: error

      - name: Commit immutable JTP-1 result record to experiment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/jtp_1
          if ! git diff --cached --quiet; then
            git commit -m 'Record frozen JTP-1 results'
            git push origin HEAD:jtp-1
          fi
