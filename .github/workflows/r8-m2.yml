name: R8-M2 Symmetry-Breaking Provenance

on:
  push:
    branches: [r8-m2-symmetry-breaking]

permissions:
  contents: write
  actions: read

jobs:
  smoke:
    name: R8-M2 smoke gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/r8_m2/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r experiments/r8_m2/requirements.txt
      - name: Compile frozen implementation
        run: |
          test -f experiments/r8_m2/PREREGISTRATION.md
          python -m py_compile experiments/r8_m2/run_r8_m2.py
          python -m py_compile experiments/r8_m2/classify_r8_m2.py
      - name: Outcome-free classifier self-check
        run: |
          python - <<'PY'
          import importlib.util
          import numpy as np
          spec = importlib.util.spec_from_file_location('c', 'experiments/r8_m2/classify_r8_m2.py')
          c = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(c)
          assert c.map_to_identity(np.arange(8)).tolist() == [5.0, 6.0, 7.0, 0.0, 1.0, 2.0, 3.0, 4.0]
          assert abs(c.spearman(np.arange(8), np.arange(8)) - 1.0) < 1e-12
          assert c.binomial_tail(8, 4, 1.0 / 8.0) < 0.05
          print('classifier self-check ok')
          PY
      - name: Run outcome-free smoke path
        run: |
          rm -rf /tmp/r8m2-smoke
          python experiments/r8_m2/run_r8_m2.py --seed 3 --outdir /tmp/r8m2-smoke --smoke
          test -f /tmp/r8m2-smoke/smoke_summary.json

  primary:
    name: R8-M2 fresh family ${{ matrix.seed }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        seed: [3, 9, 21, 28, 44, 62, 86, 101]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/r8_m2/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r experiments/r8_m2/requirements.txt
      - name: Execute paired symmetry-breaking family
        run: |
          mkdir -p results/r8_m2/seed_${{ matrix.seed }}
          python experiments/r8_m2/run_r8_m2.py \
            --seed ${{ matrix.seed }} \
            --outdir results/r8_m2/seed_${{ matrix.seed }} \
            2>&1 | tee results/r8_m2/seed_${{ matrix.seed }}/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: r8-m2-seed-${{ matrix.seed }}
          path: results/r8_m2/seed_${{ matrix.seed }}/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    name: R8-M2 frozen cross-family classification
    needs: primary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/r8_m2/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r experiments/r8_m2/requirements.txt
      - name: Download family artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: r8-m2-seed-*
          path: collected
      - name: Apply frozen classifier
        run: |
          mkdir -p results/r8_m2/aggregate results/r8_m2/seeds
          cp -R collected/r8-m2-seed-* results/r8_m2/seeds/
          python experiments/r8_m2/classify_r8_m2.py --root collected --outdir results/r8_m2/aggregate
          cat results/r8_m2/aggregate/FINAL_RESULT.md
      - uses: actions/upload-artifact@v4
        with:
          name: r8-m2-authoritative-aggregate
          path: results/r8_m2/
          retention-days: 90
          if-no-files-found: error
      - name: Commit authoritative R8-M2 result record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/r8_m2
          git commit -m 'Record authoritative R8-M2 results'
          git push origin HEAD:refs/heads/r8-m2-results
