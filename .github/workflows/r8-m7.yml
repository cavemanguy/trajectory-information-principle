name: R8-M7 Reversible Demand

on:
  push:
    branches: [r8-m7-reversible-demand]
    paths:
      - 'experiments/r8_m7/**'
      - '.github/workflows/r8-m7.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONHASHSEED: '0'

jobs:
  smoke:
    name: R8-M7 smoke gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: pip install -r experiments/r8_m7/requirements.txt
      - name: Compile frozen implementation
        run: |
          python -m py_compile experiments/r8_m7/run_r8_m7.py
          python -m py_compile experiments/r8_m7/classify_r8_m7.py
      - name: Outcome-free classifier self-check
        run: python experiments/r8_m7/classify_r8_m7.py --self-check
      - name: Run outcome-free fork and schedule smoke path
        run: python experiments/r8_m7/run_r8_m7.py --seed 1003 --outdir smoke_r8_m7 --smoke
      - name: Verify smoke structure
        run: |
          python - <<'PY'
          import json
          d=json.load(open('smoke_r8_m7/smoke_summary.json'))
          assert d['status']=='ok'
          assert d['A'] != d['B']
          assert set(d['condition_Q']) == {'SWITCH','FIX','H0SWITCH'}
          assert all(len(v)==3 for v in d['condition_Q'].values())
          print('A,B', d['A'], d['B'])
          print('baseline Q', d['baseline_Q'])
          PY

  fresh:
    name: R8-M7 fresh family ${{ matrix.seed }}
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [207, 223, 239, 254, 271, 288, 304, 321, 337, 354, 371, 389]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: pip install -r experiments/r8_m7/requirements.txt
      - name: Execute paired reversible-demand family
        run: python experiments/r8_m7/run_r8_m7.py --seed ${{ matrix.seed }} --outdir results/r8_m7/seed_${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: r8-m7-seed-${{ matrix.seed }}
          path: results/r8_m7/seed_${{ matrix.seed }}
          retention-days: 90

  classify:
    name: R8-M7 frozen cross-family classification
    needs: fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: pip install -r experiments/r8_m7/requirements.txt
      - name: Download family artifacts without flattening
        uses: actions/download-artifact@v4
        with:
          pattern: r8-m7-seed-*
          path: all_seed_artifacts
          merge-multiple: false
      - name: Apply frozen classifier
        run: python experiments/r8_m7/classify_r8_m7.py --root all_seed_artifacts --outdir results/r8_m7/aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: r8-m7-aggregate
          path: results/r8_m7/aggregate
          retention-days: 90
      - name: Commit authoritative R8-M7 result record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C r8-m7-results
          git add results/r8_m7/aggregate/FINAL_RESULT.md results/r8_m7/aggregate/FINAL_RESULT.json
          git commit -m 'Record authoritative R8-M7 results'
          git push --force origin r8-m7-results
