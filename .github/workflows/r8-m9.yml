name: R8-M9 Component Localization of Persistent History

on:
  push:
    branches: [r8-m9-component-localization]
    paths:
      - 'experiments/r8_m9/**'
      - '.github/workflows/r8-m9.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONHASHSEED: '0'

jobs:
  smoke:
    name: R8-M9 smoke gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: pip install -r experiments/r8_m9/requirements.txt
      - name: Compile frozen implementation
        run: |
          python -m py_compile experiments/r8_m9/m7r_base.py
          python -m py_compile experiments/r8_m9/run_r8_m9.py
          python -m py_compile experiments/r8_m9/classify_r8_m9.py
      - name: Outcome-free classifier self-check
        run: python experiments/r8_m9/classify_r8_m9.py --self-check
      - name: Run outcome-free transplant smoke path
        run: python experiments/r8_m9/run_r8_m9.py --seed 1009 --outdir /tmp/r8_m9_smoke --smoke
      - name: Verify smoke structure
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/r8_m9_smoke/smoke_summary.json'))
          assert d['status']=='ok'
          assert d['A'] != d['B']
          assert set(d['Q']) == {'AA','AB','BA','BB'}
          assert len(d['reader_keys']) == 8
          assert set(d['partition_hashes']) == {'A','B'}
          for side in ('A','B'):
              assert set(d['partition_hashes'][side]) == {'E','F','R'}
          print('R8-M9 smoke structure ok')
          PY

  family:
    name: R8-M9 fresh family ${{ matrix.seed }}
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        seed: [631, 648, 664, 681, 699, 716, 733, 751, 768, 784, 802, 821]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: pip install -r experiments/r8_m9/requirements.txt
      - name: Execute fresh component-localization family
        run: |
          mkdir -p results/r8_m9/seed_${{ matrix.seed }}
          python experiments/r8_m9/run_r8_m9.py \
            --seed ${{ matrix.seed }} \
            --outdir results/r8_m9/seed_${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: r8-m9-seed-${{ matrix.seed }}
          path: results/r8_m9/seed_${{ matrix.seed }}/seed_summary.json
          if-no-files-found: error

  classify:
    name: R8-M9 frozen cross-family classification
    needs: family
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: pip install -r experiments/r8_m9/requirements.txt
      - name: Download family artifacts without flattening
        uses: actions/download-artifact@v4
        with:
          pattern: r8-m9-seed-*
          path: results/r8_m9/families
          merge-multiple: false
      - name: Apply frozen classifier
        run: |
          mkdir -p results/r8_m9/aggregate
          python experiments/r8_m9/classify_r8_m9.py \
            --root results/r8_m9/families \
            --outdir results/r8_m9/aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: r8-m9-aggregate
          path: results/r8_m9/aggregate/
          if-no-files-found: error
      - name: Commit authoritative R8-M9 result record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B r8-m9-results
          git add results/r8_m9/aggregate/FINAL_RESULT.json results/r8_m9/aggregate/FINAL_RESULT.md
          git commit -m 'Record frozen R8-M9 result' || true
          git push --force origin HEAD:r8-m9-results
