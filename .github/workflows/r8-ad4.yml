name: R8-AD4 Motion-Component Decomposition

on:
  push:
    paths:
      - 'experiments/r8_ad4/**'
      - '.github/workflows/r8-ad4.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONHASHSEED: '0'

jobs:
  smoke:
    name: R8-AD4 outcome-free smoke gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: pip install -r experiments/r8_ad4/requirements.txt
      - name: Compile implementation
        run: |
          python -m py_compile experiments/r8_ad4/run_r8_ad4.py
          python -m py_compile experiments/r8_ad4/classify_r8_ad4.py
      - name: Verify parent engine and AD3 record exist
        run: |
          test -f experiments/r8_m10/m7r_base.py
          test -f experiments/r8_ad3/run_r8_ad3.py
          test -f results/r8_ad3/aggregate/FINAL_RESULT.json
      - name: Outcome-free classifier self-check
        run: python experiments/r8_ad4/classify_r8_ad4.py --self-check
      - name: Run smoke path
        run: python experiments/r8_ad4/run_r8_ad4.py --seed 1782 --outdir /tmp/r8_ad4_smoke --smoke
      - name: Verify smoke structure
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/r8_ad4_smoke/smoke_summary.json'))
          assert d['experiment']=='R8-AD4'
          assert d['all_valid'] is True
          q=d['diagnostic']
          assert q['finite'] is True
          assert set(q['by_time']) == {str(i) for i in range(1,12)}
          for t in range(1,12):
              rr=q['by_time'][str(t)]
              for k in ['STATE','FULL','SHUFFLED_FULL','DIRECTION','MAGNITUDE','ABS_PATTERN','SIGN_PATTERN']:
                  assert k in rr
              if t>=2:
                  assert 'FULL_CURVATURE' in rr and 'FULL_TURN' in rr
              cc=q['coordinate_by_time'][str(t)]
              assert 0 <= cc['best_coordinate'] < 16
              assert len(cc['top4_coordinates']) == 4
          print('R8-AD4 smoke structure ok')
          PY

  family:
    name: R8-AD4 lineage ${{ matrix.seed }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        seed: [1782, 1801, 1819, 1838, 1856, 1875, 1893, 1912, 1930, 1949, 1967, 1986]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: pip install -r experiments/r8_ad4/requirements.txt
      - name: Execute frozen motion decomposition family
        run: |
          mkdir -p results/r8_ad4/seed_${{ matrix.seed }}
          python experiments/r8_ad4/run_r8_ad4.py \
            --seed ${{ matrix.seed }} \
            --outdir results/r8_ad4/seed_${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: r8-ad4-seed-${{ matrix.seed }}
          path: results/r8_ad4/seed_${{ matrix.seed }}/seed_summary.json
          if-no-files-found: error

  classify:
    name: R8-AD4 frozen cross-lineage classification
    needs: family
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: pip install -r experiments/r8_ad4/requirements.txt
      - name: Download family artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: r8-ad4-seed-*
          path: results/r8_ad4/families
          merge-multiple: false
      - name: Apply frozen classifier
        run: |
          mkdir -p results/r8_ad4/aggregate
          python experiments/r8_ad4/classify_r8_ad4.py \
            --root results/r8_ad4/families \
            --outdir results/r8_ad4/aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: r8-ad4-aggregate
          path: results/r8_ad4/aggregate/
          if-no-files-found: error
      - name: Commit authoritative R8-AD4 result record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B r8-ad4-results
          git add results/r8_ad4/aggregate/FINAL_RESULT.json results/r8_ad4/aggregate/FINAL_RESULT.md
          git commit -m 'Record frozen R8-AD4 result' || true
          git push --force origin HEAD:r8-ad4-results
