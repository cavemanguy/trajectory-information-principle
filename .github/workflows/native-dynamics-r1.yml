name: ND-R1 Native Dynamics

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  primary:
    name: ND-R1 fresh seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        seed: [13, 29, 53]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/native_dynamics_r1/requirements.txt

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r experiments/native_dynamics_r1/requirements.txt

      - name: Verify frozen protocol and source
        run: |
          test -f experiments/native_dynamics_r1/PREREGISTRATION.md
          test -f experiments/native_dynamics_r1/IMPLEMENTATION_PROVENANCE.md
          test -f experiments/native_dynamics_r1/run_nd_r1.py
          test -f experiments/native_dynamics_r1/classify_nd_r1.py
          python -m py_compile experiments/native_dynamics_r1/run_nd_r1.py
          python -m py_compile experiments/native_dynamics_r1/classify_nd_r1.py

      - name: Execute fresh-seed native dynamics study
        run: |
          mkdir -p results/native_dynamics_r1/seed_${{ matrix.seed }}
          python experiments/native_dynamics_r1/run_nd_r1.py \
            --seed ${{ matrix.seed }} \
            --outdir results/native_dynamics_r1/seed_${{ matrix.seed }} \
            2>&1 | tee results/native_dynamics_r1/seed_${{ matrix.seed }}/run.log

      - uses: actions/upload-artifact@v4
        with:
          name: nd-r1-seed-${{ matrix.seed }}
          path: results/native_dynamics_r1/seed_${{ matrix.seed }}/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    name: ND-R1 frozen cross-seed classification
    needs: primary
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/native_dynamics_r1/requirements.txt

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r experiments/native_dynamics_r1/requirements.txt

      - name: Download fresh-seed outputs
        uses: actions/download-artifact@v4
        with:
          pattern: nd-r1-seed-*
          path: collected

      - name: Apply frozen ND-R1 outcome rule
        run: |
          mkdir -p results/native_dynamics_r1/aggregate results/native_dynamics_r1/seeds
          cp -R collected/nd-r1-seed-* results/native_dynamics_r1/seeds/
          python experiments/native_dynamics_r1/classify_nd_r1.py \
            --root collected \
            --outdir results/native_dynamics_r1/aggregate
          cat results/native_dynamics_r1/aggregate/FINAL_RESULT.md

      - uses: actions/upload-artifact@v4
        with:
          name: nd-r1-authoritative-aggregate
          path: results/native_dynamics_r1/
          retention-days: 90
          if-no-files-found: error

      - name: Commit authoritative ND-R1 result record to dedicated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/native_dynamics_r1
          git commit -m 'Record authoritative ND-R1 results'
          git push origin HEAD:refs/heads/native-dynamics-r1-results
