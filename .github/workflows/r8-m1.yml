name: R8-M1 Objective Decomposition

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  smoke:
    name: R8-M1 smoke gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/r8_m1/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r experiments/r8_m1/requirements.txt
      - name: Compile frozen implementation
        run: |
          test -f experiments/r8_m1/PREREGISTRATION.md
          test -f experiments/r8_m1/IMPLEMENTATION_DETAILS.md
          python -m py_compile experiments/r8_m1/run_r8_m1.py
          python -m py_compile experiments/r8_m1/classify_r8_m1.py
      - name: Run outcome-free smoke path
        run: |
          rm -rf /tmp/r8m1-smoke
          python experiments/r8_m1/run_r8_m1.py --seed 11 --outdir /tmp/r8m1-smoke --smoke
          test -f /tmp/r8m1-smoke/smoke_summary.json

  primary:
    name: R8-M1 fresh seed ${{ matrix.seed }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        seed: [11, 37, 71]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/r8_m1/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r experiments/r8_m1/requirements.txt
      - name: Execute paired native-dynamics decomposition
        run: |
          mkdir -p results/r8_m1/seed_${{ matrix.seed }}
          python experiments/r8_m1/run_r8_m1.py \
            --seed ${{ matrix.seed }} \
            --outdir results/r8_m1/seed_${{ matrix.seed }} \
            2>&1 | tee results/r8_m1/seed_${{ matrix.seed }}/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: r8-m1-seed-${{ matrix.seed }}
          path: results/r8_m1/seed_${{ matrix.seed }}/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    name: R8-M1 frozen cross-seed classification
    needs: primary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/r8_m1/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r experiments/r8_m1/requirements.txt
      - name: Download seed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: r8-m1-seed-*
          path: collected
      - name: Apply frozen classifier
        run: |
          mkdir -p results/r8_m1/aggregate results/r8_m1/seeds
          cp -R collected/r8-m1-seed-* results/r8_m1/seeds/
          python experiments/r8_m1/classify_r8_m1.py --root collected --outdir results/r8_m1/aggregate
          cat results/r8_m1/aggregate/FINAL_RESULT.md
      - uses: actions/upload-artifact@v4
        with:
          name: r8-m1-authoritative-aggregate
          path: results/r8_m1/
          retention-days: 90
          if-no-files-found: error
      - name: Commit authoritative R8-M1 result record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/r8_m1
          git commit -m 'Record authoritative R8-M1 results'
          git push origin HEAD:refs/heads/r8-m1-results
